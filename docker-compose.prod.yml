version: '3.9'

services:
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo-prod:27017/relic-query
    depends_on:
      - mongo-prod
    restart: unless-stopped

  mongo-prod:
    image: mongo:7.0
    volumes:
      - mongo-prod-data:/data/db
    restart: unless-stopped

volumes:
  mongo-prod-data:
